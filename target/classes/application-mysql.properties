server.port=8080
spring.application.name=teamforge-ai

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/teamforge_ai?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Python ML Prediction Service URL
ml.service.url=http://localhost:5000

spring.jackson.serialization.write-dates-as-timestamps=false
